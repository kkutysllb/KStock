# The `kstock-investor` agent preset: KStock A-share quant research agent.
#
# Fork of the shipped `standard` preset (packages/preset/agent-presets/
# presets/standard/agent.cordis.yml) with the persona row rewritten for
# KStock. Every other row is kept verbatim from `standard`; upstream rows
# must not drift from the fork source without re-checking both files.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml` + `@kstock/web`)
# keeps everything a preset must not own: the registries themselves, the
# sandbox and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `qilin-agent-presets`
# rejects that at mount. `true` means an entry-local realm: this standing
# mount's own private instance, apart from every other preset's. (A shared
# label does NOT pool instances — `provide()` throws on the second
# registration under the same realm symbol; labels join REALMS, and are not
# what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# KStock「因子挖掘」角色 persona（lead_soul v2 角色版）：职责 + 四纪律。
- id: persona
  name: '@qilin/persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      你是 KStock「因子挖掘」——A 股量化投研专家，由 {{model}} 模型驱动，工作目录 {{cwd}}。

      职责：因子研究与有效性检验——factor-research 引擎，IC/ICIR、分层回测（分组收益与多空组合）口径。

      因子结论必须带检验窗口、样本范围与去极值/标准化预处理说明；过拟合风险（IC 衰减、分层单调性破坏）必须显式评估；重要因子版本经 /kstock-api 归档因子库。

      技能纪律：先用 skill 工具加载对应技能，按技能文档在其基目录内执行脚本；数据缺失诚实标注「无数据」，禁止编造。数据源凭据（TUSHARE_TOKEN 等）只在环境中间接使用，禁止在回复、报告、产物文件中回显或记录。

      长任务纪律：预估超过 30 秒的引擎或回测命令用 bash 的 run_in_background 后台执行（返回 job id 后用 job_output 收集、job_kill 终止），互不依赖的多路采集全部后台化并行、收齐再汇总；后台输出仍按分区纪律落 data/，收集时先校验退出码与 JSON 完整性；禁止 nohup 加 sleep/tail 轮询。

      委派纪律：多标的/多维度并行用 subagent 分派，委派 prompt 写明要加载的技能、命令与输出格式；子代理返回的数值与表格原样转述，禁止改写。

      交付纪律：报告类任务的最终交付必须是经 html-report 技能渲染的单文件 HTML 看板（先构造结构化报告 JSON，渲染后归档报告库 POST /kstock-api/reports，再 present 呈现）；禁止只输出文本总结。

      风险纪律：结论必须带数据依据与时间戳；全部输出为研究参考，不构成投资建议；方向性判断给出依据与反证信号。

- id: agent-instructions
  name: '@qilin/agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: a host row that injects a
# service is the criterion for host-plane ownership — injection resolves
# before any session exists. Both shell tools consume the host registry from
# here; their executors (`bash-sandbox`/`pwsh-sandbox`) are host-plane too.
# KStock 技能脚本（python3）经沙箱 bash 执行。
- id: tool-bash
  name: '@qilin/tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@qilin/tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@qilin/tool-fs'

- id: tool-fs-search
  name: '@qilin/tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane.
# KStock 长耗时数据拉取/批量回测用 run_in_background 后台化后经此收集。
- id: tool-jobs
  name: '@qilin/tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# KStock 技能随 preset 分发（cordis preset 同款模式）：preset 目录自带
# skills/（32 个投研技能 + market-linkage 场景 + html-report + 本路径指南），
# baseUrl 由 preset mount 机制改写为本 preset 目录，拷到哪都能解析。
# 技能目录在构建期由 patch_vendor_skills.py 从 vendor/skills/public 发布。
# 子代理继承父组合，故委派出的子代理天然看到同一批技能。
- id: skill-filesystem
  name: '@qilin/skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@qilin/tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the
# Gateway can resolve them. The human command and model-facing tool register
# into this preset's scoped layers.
- id: command-goal
  name: '@qilin/command-goal'

- id: tool-goal
  name: '@qilin/tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@qilin/plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@qilin/compaction-basic'

    - id: command-compact
      name: '@qilin/command-compact'

    - id: tool-result-pruner
      name: '@qilin/compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here.
# KStock 委派纪律见 persona：分派 prompt 写明技能与输出格式。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@qilin/tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@qilin/tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@qilin/tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent
    # and the inherited history remains eligible for KV Cache reuse. This
    # preset keeps fork continuable; parent and child inherit the same
    # messaging tool, while the parent id and return guidance follow the
    # inherited history.
    - id: tool-subagent-fork
      name: '@qilin/tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production qilin does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host
    # availability alone grants no tool.
    - id: tool-subagent-codex
      name: '@qilin/tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@qilin/tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@qilin/workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@qilin/tool-workflow'

    # Off by default with the base row it mirrors: the tool description
    # restricts `ralph` to runs the human explicitly asked for, and completion
    # is a worker self-report, not an independent evaluation. Preset files
    # take no patches, so a session that wants it duplicates this preset under
    # a new id and drops `disabled`; the shipped root shadows a copy that
    # reuses this id.
    - id: tool-ralph
      name: '@qilin/tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@qilin/tool-ask-user'

- id: tool-todo
  name: '@qilin/tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. KStock 研究补充：研报/新闻/公告检索。
- id: tool-web
  name: '@qilin/tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@qilin/tool-present'
