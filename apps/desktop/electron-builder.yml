appId: com.kkutysllb.kstock
productName: KStock
copyright: Copyright © 2024 kkutysllb

directories:
  output: release
  buildResources: build

# 桌面端不依赖需要 node-gyp 重建的原生模块（内置引擎是自包含单文件可执行，
# 不是 node-pty 等 native addon）。关闭 npm rebuild 加快构建并避免本机
# 工具链差异。
npmRebuild: false

# 主进程入口由 package.json 的 "main": "dist-electron/main.cjs" 提供，
# 必须随包分发。2.0 起无自建 SPA（渲染层是引擎 web 工作区），不再打 dist/。
files:
  - dist-electron/**/*
  - package.json
  # 托盘图标 + macOS Dock 图标：打包态 createTrayImage/setDockIcon
  # 从 app.getAppPath()/build/... 读取，必须显式打入 asar。
  # 逐档形制由 scripts/build-icons.sh 生成（设计源 docs/design/icon-refresh/）：
  #   托盘三端统一为「上游麒麟彩色印章」（tray-16/20/24/32.png + tray.ico）
  #   icons/ 16→1024 全档
  - build/tray.png
  - build/tray@2x.png
  - build/tray-*.png
  - build/tray.ico
  - build/icon.png
  - build/icons/*.png
  - "!**/*.map"
  - "!**/*.ts"

# 内置引擎分发束（scripts/build-engine-bundle.sh 产物），运行时位于
# resources/engine：kstock-engine 单文件可执行 + plugins/（KStock 插件包，
# 首启 profile 引导的链接目标）+ skills/（KSTOCK_SKILLS_DIR 挂载）。
extraResources:
  - from: ../../dist-exe
    to: engine
    filter: ["**/*"]

mac:
  category: public.app-category.finance
  icon: build/icon.icns
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/Entitlements.plist
  entitlementsInherit: build/Entitlements.plist
  # 代码签名在 CSC_LINK（base64 .p12）+ CSC_KEY_PASSWORD 存在时自动启用
  # （GitHub Actions secrets 注入）。本地未签名构建用：
  #   CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac
  # 公证（notarization）：electron-builder 在 APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 三个环境变量齐全时自动公证。
  # 引擎 Mach-O 的预签由 build-engine-bundle.sh 负责（APPLE_SIGNING_IDENTITY）。

dmg:
  title: "${productName} ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # 安装前终止残留的引擎进程，避免文件占用导致复制失败。
  include: build/installer.nsh
  # 强制 NSIS 安装包文件名带连字符 (KStock-Setup-1.0.8.exe)。
  # electron-builder 默认 ${productName} Setup ${version}.${ext} 带空格,
  # GitHub Release 不允许资源名带空格,内部会替换成连字符写入 latest.yml.url;
  # 但实际文件 / 上传步骤仍可能输出点分隔符 (KStock.Setup.1.0.8.exe),导致
  # electron-updater 按 latest.yml 拼接下载 URL 时 404。
  # 这里显式固定命名,让"实际文件 + latest.yml.url + GitHub 资源名"三处一致,
  # 跨平台自动更新链路即可正常工作。
  artifactName: ${productName}-Setup-${version}.${ext}

linux:
  icon: build/icons
  category: Finance
  target:
    - deb
    - rpm

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3

publish:
  provider: github
  owner: kkutysllb
  repo: KStock
  releaseType: release
