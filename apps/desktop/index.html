<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KStock</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030d0b;
        color: #6bada1;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 14px;
        z-index: 9999;
        transition: opacity 0.2s;
      }
      #boot-loader.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- 加载占位：React mount 后由 main.tsx 移除。若 JS 执行失败（黑屏），
         用户会看到此提示而非纯黑屏，肉眼即可确认是渲染层 JS 问题。 -->
    <div id="boot-loader">KStock 正在加载…</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
