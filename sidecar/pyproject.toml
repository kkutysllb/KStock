[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kstock-sidecar"
version = "0.1.0"
description = "KStock Python sidecar"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
