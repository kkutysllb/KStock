name: CI

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  pull_request:

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Python 运行时依赖（vendor/qilin + gateway 运行面）由 uv 统一管理
      - run: uv sync
      - run: bash scripts/check-ci.sh

  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync
      - run: pnpm -C apps/desktop exec playwright install chromium
      - run: pnpm -C apps/desktop exec playwright test
