name: Release

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    tags:
      - "v*"

# 创建 GitHub Release 需要 contents: write（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux Tauri 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # Python 运行时依赖（vendor/qilin + gateway 运行面）由 uv 统一管理
      - run: uv sync
      - name: 导入 Apple 签名证书（macOS）
        if: runner.os == 'macOS'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PWD: ${{ secrets.MAC_CERTIFICATE_PWD }}
        run: |
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/kstock.p12"
          keychain="$RUNNER_TEMP/kstock.keychain"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/kstock.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PWD" -A -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # 从钥匙串解析证书身份（如 "Developer ID Application: xxx (TEAMID)"），供 tauri codesign 使用
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"[^"]*"' | tr -d '"' | head -1)"
          if [ -z "$identity" ]; then
            echo "未在 CI keychain 中找到 Developer ID Application 签名身份" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: 校验并构建（check-release.sh）
        timeout-minutes: 60
        env:
          # macOS 公证：tauri bundler 检测到三个变量齐备后自动 notarytool 公证并 staple
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # updater 签名：tauri bundler 检测到签名密钥后为产物生成 .sig 与 latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/check-release.sh
      - name: 收集安装包
        run: |
          mkdir -p dist-release
          # 安装包 + 签名文件（.sig，tauri-cli 已签名；latest.json 在 publish 阶段生成）
          find apps/desktop/src-tauri/target/release/bundle -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o \
            -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.sig' \
          \) -exec cp {} dist-release/ \;
          # macOS 的 .app.tar.gz 文件名不含架构标记，按 uname 架构重命名，
          # 供 latest.json 正确映射 darwin-aarch64 / darwin-x86_64
          if [ "$RUNNER_OS" = "macOS" ]; then
            arch="$(uname -m)"
            mv dist-release/KStock.app.tar.gz "dist-release/KStock_${arch}.app.tar.gz"
            mv dist-release/KStock.app.tar.gz.sig "dist-release/KStock_${arch}.app.tar.gz.sig"
          fi
          ls -lh dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: kstock-${{ matrix.os }}
          path: dist-release/**
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: 生成 latest.json（updater 元数据，基于各平台产物 + .sig）
        env:
          KSTOCK_VERSION: ${{ github.ref_name }}
        run: |
          python3 - "$KSTOCK_VERSION" <<'PY'
          import glob
          import json
          import os
          import sys
          from datetime import datetime, timezone

          version = sys.argv[1].lstrip("v")
          url_prefix = "https://github.com/kkutysllb/KStock/releases/latest/download/"
          platforms = {}

          def add(key, path):
              sig_file = path + ".sig"
              if not os.path.exists(sig_file):
                  raise SystemExit(f"缺少签名文件: {sig_file}")
              with open(sig_file, encoding="utf-8") as fh:
                  signature = fh.read().strip()
              platforms[key] = {
                  "signature": signature,
                  "url": url_prefix + os.path.basename(path),
              }

          for f in glob.glob("dist-release/*.app.tar.gz"):
              is_arm = ("aarch64" in f) or ("arm64" in f)
              add("darwin-aarch64" if is_arm else "darwin-x86_64", f)
          msis = glob.glob("dist-release/*.msi")
          if msis:
              add("windows-x86_64", msis[0])
          else:
              for f in glob.glob("dist-release/*.exe"):
                  add("windows-x86_64", f)
                  break
          for f in glob.glob("dist-release/*.AppImage") + glob.glob("dist-release/*.deb"):
              add("linux-x86_64", f)

          if not platforms:
              raise SystemExit("未找到任何 updater 产物")
          data = {
              "version": version,
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          with open("dist-release/latest.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2, ensure_ascii=False)
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PY
      - name: 列出安装包
        run: ls -lh dist-release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/**
          generate_release_notes: true
