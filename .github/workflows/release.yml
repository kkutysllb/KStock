name: Release

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    tags:
      - "v*"

# 最小权限：默认只读；仅 publish job 声明 contents: write（创建 Release 需要）。
# build 矩阵只构建和上传 artifact，不需要写权限——顶层收窄避免单个 runner
# 被攻破时直接获得仓库写令牌（供应链防线）。
permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: 校验并构建（check-release.sh：CI 门禁 + 引擎分发束 + 桌面打包）
        timeout-minutes: 90
        env:
          # macOS 双层签名 + 公证（两层签名密钥分工不同）：
          # 1) 引擎预签：build-engine-bundle.sh 读取 APPLE_SIGNING_IDENTITY
          #    （格式 "Developer ID Application: 名字 (TeamID)"），用 codesign
          #    预签引擎 Mach-O 二进制（kstock-engine{,-rg,-spawn-helper}）。
          #    electron-builder 不会递归签 extraResources，未预签会导致
          #    Apple 公证 HARDFAIL。
          # 2) .app 外壳签名：electron-builder 原生读取 CSC_LINK（base64 .p12）+
          #    CSC_KEY_PASSWORD，签 KStock.app 主体。
          # 3) 公证：electron-builder 在 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
          #    APPLE_TEAM_ID 三者齐全时自动提交 notarytool 公证。
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/check-release.sh
      - name: 收集安装包
        run: |
          mkdir -p dist-release
          # electron-builder 产物在 apps/desktop/release/
          # 按扩展名收集所有安装包 + updater 元数据，不依赖文件名前缀。
          # macOS 产物名基于 productName（KStock*），Linux deb/rpm 基于
          # package.json name（kstock-desktop_*），用扩展名匹配最可靠。
          # blockmap 是 electron-updater 增量更新的元数据，必须随包分发。
          find apps/desktop/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} dist-release/ \;
          ls -lh dist-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kstock-${{ matrix.os }}
          path: dist-release/**
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-release
          merge-multiple: true
      - name: 列出安装包
        run: ls -lh dist-release
      - name: 生成发布说明（release/<tag>.md，转绝对链接并回填发布日期）
        run: bash scripts/publish_release_notes.sh "$GITHUB_REF_NAME" release-notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-release/**
          body_path: release-notes.md
