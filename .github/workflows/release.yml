name: Release

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    tags:
      - "v*"

# 创建 GitHub Release 需要 contents: write（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Python 运行时依赖（vendor/qilin + gateway 运行面）由 uv 统一管理
      - run: uv sync
      - name: 校验并构建（check-release.sh）
        timeout-minutes: 60
        env:
          # macOS 签名 + 公证（electron-builder 原生支持 CSC_LINK / APPLE_* 环境变量）
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/check-release.sh
      - name: 收集安装包
        run: |
          mkdir -p dist-release
          # electron-builder 产物在 apps/desktop/release/
          # 收集安装包 + updater 元数据（latest*.yml），排除 blockmap 等中间产物。
          # electron-builder 自动为 electron-updater 生成 latest-mac.yml / latest.yml /
          # latest-linux.yml，无需手动构造旧版 JSON 清单。
          find apps/desktop/release -maxdepth 1 -type f \
            \( -name 'KStock*' -o -name 'latest*.yml' \) \
            -exec cp {} dist-release/ \;
          ls -lh dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: kstock-${{ matrix.os }}
          path: dist-release/**
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: 列出安装包
        run: ls -lh dist-release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/**
          generate_release_notes: true
