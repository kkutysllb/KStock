# KStock 内置 QiLin 配置。
# 这里先提供桌面端第一阶段可启动所需的最小运行配置。
# 真正执行研究任务前，需要在产品设置页或本文件里配置模型供应商。

config_version: 31
log_level: info

token_usage:
  enabled: true

token_budget:
  enabled: false
  max_tokens: 200000
  max_input_tokens: null
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0

max_recursion_limit: 1000

models: []

skills:
  root: vendor/skills

sandbox:
  use: qilin.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

memory:
  enabled: false

# KStock 自有金融搜索工具（首次启动即生效，数据源 akshare 国内免费无限流）
tools:
  - name: finance_data_search
    group: search
    use: scripts.kstock_tools.akshare_data_tool:finance_data_search_tool
  - name: finance_news_search
    group: search
    use: scripts.kstock_tools.akshare_news_tool:finance_news_search_tool
