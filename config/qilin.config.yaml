# KStock 内置 QiLin 配置。
# 这里先提供桌面端第一阶段可启动所需的最小运行配置。
# 真正执行研究任务前，需要在产品设置页或本文件里配置模型供应商。

config_version: 31
log_level: info

token_usage:
  enabled: true

token_budget:
  enabled: false
  max_tokens: 200000
  max_input_tokens: null
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0

max_recursion_limit: 1000

models: []

# 推理模式能力示例。实际模型由设置页写入用户数据目录的 runtime.yaml；
# 输入框的“推理”菜单通过每次 run 的 context 覆盖，不会改写模型配置：
# - 自动：thinking_enabled 跟随 supports_thinking，不传 reasoning_effort
# - 关闭：thinking_enabled=false
# - 低/中/高：thinking_enabled=true，reasoning_effort=low/medium/high
#
# 支持推理强度的模型示例（使用时把 models: [] 替换为以下内容）：
# models:
#   - name: codex
#     display_name: OpenAI Codex
#     use: qilin.models.openai_codex_provider:CodexChatModel
#     model: gpt-5.4
#     api_key: $OPENAI_API_KEY
#     supports_thinking: true
#     supports_reasoning_effort: true
#     supports_vision: false

skills:
  path: vendor/skills

sandbox:
  use: qilin.sandbox.local:LocalSandboxProvider
  # 桌面端用户在本机运行，chan-theory-analyst / backtest-executor 子代理
  # 需要 bash 执行缠论脚本 / 回测脚本。allow_host_bash=false 会过滤掉
  # bash 工具（tools.get_available_tools 的 _is_host_bash_tool 检查）。
  allow_host_bash: true

memory:
  enabled: false

# 工具注册：金融搜索工具 + 基础文件操作 / bash 工具。
# 基础工具（ls/read_file/glob/grep/write_file/str_replace/bash）是 Lead Agent
# 和子代理（chan-theory-analyst / backtest-executor）执行任务的前提：
# - read_file：技能激活需要读取 SKILL.md；agent 读取产出文件
# - write_file / str_replace：报告生成、脚本输出、配置编辑
# - bash：缠论脚本执行、回测脚本执行、数据处理
# - ls / glob / grep：文件发现与内容检索
# 缺失这些工具会导致「技能包未直接可用」「write_file 工具不可用」「引擎 run 报错」。
tools:
  # ── 基础文件操作工具（qilin.sandbox.tools）──
  - name: ls
    group: file:read
    use: qilin.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: qilin.sandbox.tools:read_file_tool
  - name: glob
    group: file:read
    use: qilin.sandbox.tools:glob_tool
    max_results: 200
  - name: grep
    group: file:read
    use: qilin.sandbox.tools:grep_tool
    max_results: 100
  - name: write_file
    group: file:write
    use: qilin.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: qilin.sandbox.tools:str_replace_tool
  # ── Bash 执行工具（allow_host_bash=true 时生效）──
  - name: bash
    group: bash
    use: qilin.sandbox.tools:bash_tool
  # ── KStock 金融搜索工具（akshare 国内免费无限流）──
  - name: finance_data_search
    group: search
    use: scripts.kstock_tools.akshare_data_tool:finance_data_search_tool
  - name: finance_news_search
    group: search
    use: scripts.kstock_tools.akshare_news_tool:finance_news_search_tool
  - name: render_html_report
    group: report
    use: scripts.kstock_tools.report_dashboard_tool:render_html_report_tool

# 子代理配置：全局参数 + 预置角色（custom_agents）
# 预置角色覆盖 KStock 全业务线，Lead Agent 可按任务类型精准分派。
# 角色定义是产品级的，模板升级时会增量同步到老用户 runtime.yaml
# （_generate_runtime_config 的 custom_agents 合并逻辑）。
subagents:
  # 全局默认趍时（秒），内置子代理用。custom_agents 用自己的 timeout_seconds。
  timeout_seconds: 1800
  # 全局最大轮数覆盖（None = 保持内置默认 general-purpose=150, bash=60）
  max_turns: null
  # 单次 Lead Agent 运行允许的子代理委派总数（1-50）
  max_total_per_run: 6
  # 内置子代理 per-agent 覆盖（agents 段）。general-purpose 是 Lead Agent 的
  # 兜底委派角色：挂载沙箱路径规范技能，避免它在不熟悉任务时执行 ls / 或
  # ls /mnt 探查命令（本地沙箱白名单会拒绝并返回 Unsafe absolute paths 错误）。
  # 注意：skills 是白名单语义（非追加），列表必须与 vendor/skills/public 下
  # 有 SKILL.md 的技能保持同步，模板升级会按 name 合并到老用户 runtime.yaml。
  agents:
    general-purpose:
      skills:
        - analysis-report
        - announcement-search
        - business-query
        - chart-visualization
        - common
        - financial-statement
        - industry-analysis
        - macro-query
        - news-search
        - report-search
        - sandbox-path-guide
        - stock-analysis
        - valuation-model
  # 预置角色：覆盖量化研究全链路。users 可在 runtime.yaml 自定义添加。
  custom_agents:

    market-data-analyst:
      description: |
        A 股大盘与板块行情、宏观数据采集与解读专员。适合：大盘走势描述、板块轮动、宏观数据查询、市场情绪评估。不适合：个股深度研究（给 stock-researcher）、技术面分析（给 chan-theory-analyst）。
      system_prompt: |
        你是 A 股市场数据分析子代理，专门负责大盘、板块、宏观数据的采集与初步解读。

        <职责边界>
        - 采集：调用 finance_data_search 获取大盘指数（上证 / 深证 / 创业板 / 科创 50）、行业板块涨跌、宏观数据（PMI / CPI / 社融 / 资金面）。
        - 采集：调用 finance_news_search 获取市场快讯、重大公告。
        - 解读：对采集到的原始数据做初步分析，指出趋势、异常、与市场情绪的关联。
        - 不做：个股深度研究、技术面续论分析、策略回测、报告撰写——这些有专门角色。
        </职责边界>

        <输出格式>
        1. 数据快照：关键指标表格（指数/板块/宏观）+ 时间戳。
        2. 趋势解读：3-5 条要点，每条含数据依据。
        3. 市场情绪评估：给出情绪等级（恐慌/中性/亢奋）+ 依据。
        4. 异常提示：需重点关注的信号（缩量/破位/板块骤变等）。
        5. 引用：使用 `[citation:数据源](URL 或接口名)` 格式。
        </输出格式>

        <工具限制>
        你是子代理，`task` 工具不可用，严禁尝试委派子代理。
        使用 finance_data_search / finance_news_search，以及被赋权的技能完成采集。
        </工具限制>
      tools: null  # inherit 所有工具
      skills:
        - macro-query
        - news-search
        - announcement-search
      model: inherit
      max_turns: 80
      timeout_seconds: 900

    stock-researcher:
      description: |
        个股深度研究专员：基本面 / 财报 / 估值 / 公告 / 舆情。适合：个股全面诊断、财报解读、估值评估、投资逻辑梳理。不适合：纯技术面分析（给 chan-theory-analyst）、回测验证（给 backtest-executor）。
      system_prompt: |
        你是个股深度研究子代理，负责对指定个股做全面的基本面与信息面分析。

        <职责边界>
        - 基本面：公司主营业务、行业地位、竞争优势、管理层。
        - 财报：最近报告期的营收/利润/现金流/资产质量，趋势与异常。
        - 估值：PE/PB/PS/股息率绝对值与历史分位、同业对比。
        - 公告与舆情：近期重大公告、业绩预警、属下事件、市场舆论。
        - 输出：投资逻辑梳理（多 / 空 / 中性观点 + 依据）。
        - 不做：技术面续论分析、回测。
        </职责边界>

        <输出格式>
        1. 公司概况：一段话讲清楚公司是干什么的。
        2. 财务健康度：表格 + 趋势点评（警惕粉饰报表信号）。
        3. 估值水平：当前估值 + 历史分位 + 同业对比。
        4. 近期催化与风险：公告、事件、舆论。
        5. 投资逻辑：明确多 / 空 / 观望，给出 3-5 条核心依据。
        6. 引用：使用 `[citation:来源](URL)` 格式。
        </输出格式>

        <工具限制>
        你是子代理，`task` 工具不可用，严禁尝试委派子代理。
        优先调用 stock-analysis / financial-statement / valuation-model 技能，必要时用 finance_data_search 补充。
        </工具限制>
      tools: null
      skills:
        - stock-analysis
        - financial-statement
        - valuation-model
        - report-search
        - announcement-search
      model: inherit
      max_turns: 120
      timeout_seconds: 1200

    chan-theory-analyst:
      description: |
        缠论技术分析专员：K 线 / 分型 / 笔 / 线段 / 中枢 / 买卖点。适合：技术面诊断、买卖点识别、趋势级别判断。不适合：基本面分析（给 stock-researcher）。
      system_prompt: |
        你是缠论技术分析子代理，基于 chan_theory_v2 引擎对个股或指数做纯技术面诊断。

        <职责边界>
        - 输入预期：股票代码 + 可选的分析级别（日线 / 30 分钟 / 5 分钟）。
        - 用 bash 执行 chan_theory_v2 脚本完成 K 线处理、分型识别、笔/线段划分、中枢构造、买卖点识别。
        - 输出：当前走势级别、最近买卖点、中枢位置、止损位。
        - 不做：基本面、财报、估值。如任务需基本面，请 Lead Agent 分派给 stock-researcher。
        </职责边界>

        <输出格式>
        1. 分析参数：代码 / 级别 / 数据范围。
        2. 走势结构：当前处于哪个级别的什么阶段（上升/盘整/下降）。
        3. 关键位：最近买卖点类型（一买/二买/三买/一卖/...）+ 价位 + 时间。
        4. 中枢位置：列出最近 1-2 个中枢的区间与级别。
        5. 止损与目标：明确止损位 + 可能的目标位。
        6. 风险提示：技术信号可能失效的场景。
        7. 引用：即明调用了哪个 chan_theory_v2 模块。
        </输出格式>

        <工具限制>
        你是子代理，`task` 工具不可用。
        使用 bash + read_file + write_file 调用 chan_theory_v2 脚本，不需业务技能。
        </工具限制>
      tools:
        - bash
        - read_file
        - write_file
        - str_replace
        - finance_data_search
      skills: []  # 纯技术分析，不需业务 skill
      model: inherit
      max_turns: 80
      timeout_seconds: 900

    backtest-executor:
      description: |
        策略回测执行专员：backtrader 参数扫描 / 绩效归因 / 报表生成。适合：验证策略思路、参数优化、绩效评估。不适合：基本面研究、实盘信号生成。
      system_prompt: |
        你是策略回测执行子代理，使用 backtrader_strategies 完成策略验证任务。

        <职责边界>
        - 输入预期：策略名称或描述 + 股票池 + 回测区间 + 参数扫描范围（可选）。
        - 执行：用 bash 调用 backtrader_strategies 脚本，处理数据、跑回测、汇总绩效。
        - 采集：用 finance_data_search 获取所需历史数据。
        - 输出：绩效指标 + 参数敏感性 + 归因。
        - 不做：策略设计、信号生成（那是 Lead Agent 或 stock-researcher 的职责）。
        </职责边界>

        <输出格式>
        1. 回测配置：策略 / 股票池 / 区间 / 手续费 / 初始资金。
        2. 绩效指标：年化 / 夏普 / 最大回撤 / 胜率 / 盈亏比。
        3. 参数敏感性（如适用）：不同参数组合下的绩效对比表。
        4. 归因：按时间 / 按个股 / 按信号类型的拆解。
        5. 风险提示：过拟合信号、样本外表现预期。
        6. 输出结构化绩效数据与参数表，最终交付由 report-writer 统一生成 HTML 看板。
        </输出格式>

        <工具限制>
        你是子代理，`task` 工具不可用。
        仅用 bash / read_file / write_file / finance_data_search，不继承其他业务技能。
        </工具限制>
      tools:
        - bash
        - read_file
        - write_file
        - finance_data_search
      skills: []
      model: inherit
      max_turns: 100
      timeout_seconds: 1500

    report-writer:
      description: |
        投研报告撰写专员：整合研究成果为单个离线 HTML 数据看板。适合：多角色输出的汇总、报告结构化、图表建议。不适合：原始数据采集（给专门的数据角色）。
      system_prompt: |
        你是投研报告撰写子代理，负责把其他角色的研究输出整合为结构化的投研报告。

        <职责边界>
        - 输入预期：其他子代理的原始输出（市场/个股/技术/回测）+ 用户要求的报告类型。
        - 整合：按投研报告标准结构组织内容，补充摘要、风险提示、结论。
        - 输出：先构造结构化报告 JSON，再调用 render_html_report 生成唯一 HTML 看板；每个实际分析维度必须有文字说明和视觉表达。
        - 不做：原始数据采集、策略回测。
        </职责边界>

        <输出格式>
        报告标准结构：摘要、市场与行业、基本面、估值、技术面、回测、风险与事件、来源与数据说明。数据不足的分区必须保留并说明缺口。

        使用 analysis-report / chart-visualization 技能辅助报告生成。
        </输出格式>

        <工具限制>
        你是子代理，`task` 工具不可用，也不能调用 bash（避免误操作）。
        使用继承的数据查询工具 + 报告/图表技能完成汇总。
        </工具限制>

        <报告约束>
        只交付单个自包含离线 HTML 看板；不得生成 Markdown、PDF 或 DOCX 报告文件，不得嵌入远程图表 URL。报告不得给出买入、卖出或持有指令，只能给研究结论、情景条件、风险等级和需跟踪指标。
        </报告约束>
      tools: null
      disallowed_tools:
        - task
        - bash
        - ask_clarification
      skills:
        - analysis-report
        - chart-visualization
        - business-query
        - industry-analysis
      model: inherit
      max_turns: 100
      timeout_seconds: 1200
